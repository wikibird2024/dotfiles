# ========================
# Main Kitty Configuration
# ========================

include theme.conf
# Active profile of the `theme` package (overrides theme.conf, which stays as
# the fallback until a profile is picked). Switch with: theme <name>
include ~/.local/state/theme/current/palette.conf
include keybindings.conf

# ------------------------
# Window
# ------------------------
window_title Kitty-Terminal
window_padding_width 4

# ------------------------
# Font
# ------------------------
font_family      JetBrainsMono NF Light
bold_font        JetBrainsMono NF Bold
italic_font      JetBrainsMono NF Light Italic
bold_italic_font JetBrainsMono NF Bold Italic
font_size        10.0
disable_ligatures always
# Thin box lines (prompt frame, tmux borders, nvim splits) at half weight to match the Light font
box_drawing_scale 0.001, 0.5, 1.5, 2

# ------------------------
# Performance
# ------------------------
scrollback_lines 20000
repaint_delay 8
input_delay 2
sync_to_monitor yes

# ------------------------
# Bell
# ------------------------
enable_audio_bell no
visual_bell no

# ------------------------
# Shell
# ------------------------
allow_remote_control socket-only
listen_on unix:@kitty-{kitty_pid}
shell_integration enabled

# Always show the tab bar (even with one tab) so the tmux session title is visible
tab_bar_min_tabs 1
