# vim + tmux handle navigation & splits
# kitty defaults already cover clipboard & font sizing

# Ctrl+Shift+I: show the screen + scrollback in an overlay with every #rrggbb
# code painted in its own color (like nvim-colorizer). q closes it.
# hexcolor ships with the dotfiles `theme` package
map kitty_mod+i launch --type=overlay --stdin-source=@screen_scrollback sh -c '"$HOME/.local/bin/hexcolor" | less -R +G'
