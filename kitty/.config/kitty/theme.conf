
# ========================
# Kitty Theme: Ubuntu Terminal
# ========================

# ------------------------
# Background & Foreground
# ------------------------
background       #300a24
foreground       #eeeeec
# The opacity of the background. A value of 1 means fully opaque.
# This requires a compositor running on your system.
background_opacity 0.92
# Per desktop override, named after $XDG_CURRENT_DESKTOP (Ubuntu GNOME: 0.96,
# no blur there); no file for a desktop keeps 0.92.
globinclude desktop/${XDG_CURRENT_DESKTOP}.conf
# Tune live: Ctrl+Shift+A then M (more opaque) / L (less) / 1 (solid) / D (back to the configured value).
# kitty makes any cell whose color equals this background see-through; Neovim moves
# its background one shade away to stay solid (nvim kernel/solid_background.lua).
dynamic_background_opacity yes

# ------------------------
# Cursor
# ------------------------
cursor           #bbbbbb
cursor_text_color #300a24

# ------------------------
# Normal ANSI Colors
# ------------------------
# black
color0  #2e3436
# red
color1  #cc0000
# green
color2  #4e9a06
# yellow
color3  #c4a000
# blue
color4  #3465a4
# magenta
color5  #75507b
# cyan
color6  #06989a
# white
color7  #d3d7cf

# ------------------------
# Bright ANSI Colors
# ------------------------
# bright black
color8  #555753
# bright red
color9  #ef2929
# bright green
color10 #2ed011
# bright yellow
color11 #fce94f
# bright blue
color12 #87ceeb
# bright magenta
color13 #ad7fa8
# bright cyan
color14 #34e2e2
# bright white
