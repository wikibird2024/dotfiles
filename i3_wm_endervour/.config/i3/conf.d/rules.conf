# Window rules. Find a window's class with `xprop | grep WM_CLASS` (click it).
# Class matching is case-sensitive: use (?i) when unsure.

# ── apps -> workspaces (and follow them there) ────────────────
# Terminals are deliberately NOT assigned: they open on the current workspace.
assign [class="(?i)firefox"] $ws2
assign [class="Thunar|zathura"] $ws3
assign [class="(?i)thunderbird|^Code$"] $ws4
assign [class="(?i)virtualbox"] $ws5
assign [class="TelegramDesktop|(?i)teams"] $ws6

for_window [class="(?i)firefox|Thunar|zathura|(?i)thunderbird|^Code$|(?i)virtualbox|TelegramDesktop|(?i)teams"] focus

# ── floating ──────────────────────────────────────────────────
for_window [window_role="About"] floating enable
for_window [class="Yad"] floating enable
for_window [class="Galculator"] floating enable
for_window [class="Xsane"] floating enable
for_window [class="Pavucontrol"] floating enable
for_window [class="qt5ct"] floating enable
for_window [class="Blueberry.py"] floating enable
for_window [class="Bluetooth-sendto"] floating enable
for_window [class="(?i)blueman-manager"] floating enable
for_window [class="Pamac-manager"] floating enable
for_window [class="nmtui"] floating enable, resize set 800 600, move position center
