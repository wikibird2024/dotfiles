# Programs started with i3.
#   exec         = once at login
#   exec_always  = also on every $mod+Shift+r restart (only for idempotent things)
# Also started by `dex` from /etc/xdg/autostart: fcitx5 (input method),
# gnome-keyring, xdg-user-dirs. nm-applet/blueman are masked in
# ~/.config/autostart/ because the i3status-rs bar replaces them.

# ── session plumbing ──────────────────────────────────────────
exec --no-startup-id dex --autostart --environment i3
exec --no-startup-id /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec_always --no-startup-id ~/.config/i3/scripts/import-gsettings

# ── desktop services ──────────────────────────────────────────
# compositor (config: ~/.config/picom/picom.conf)
exec --no-startup-id picom -b
exec --no-startup-id dunst
exec --no-startup-id flameshot
# alternate split direction automatically
exec_always --no-startup-id autotiling

# ── screen lock / power saving ────────────────────────────────
# blank after 8 min, DPMS off after 10; xss-lock locks on blank and before suspend
exec --no-startup-id xset s 480 dpms 600 600 600
exec --no-startup-id xss-lock --transfer-sleep-lock -- ~/.config/i3/scripts/blur-lock

# ── apps at login ─────────────────────────────────────────────
exec --no-startup-id sleep 2 && alacritty
exec --no-startup-id sleep 7 && firefox https://github.com
