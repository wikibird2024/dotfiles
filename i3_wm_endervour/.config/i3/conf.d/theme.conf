# Look & feel: fonts, borders, gaps, window colours, bar (Nord palette)

# window titles / tabs
font pango: Noto Sans SemiBold 11
title_align center

# 2px border instead of title bars; tabbed/stacked layouts still show tabs
default_border pixel 2
default_floating_border pixel 2
# no border against the screen edge when a window is alone
hide_edge_borders smart

gaps inner 0
gaps outer 3

workspace_layout default

# ── window colours ────────────────────────────────────────────
set $nord0  #2e3440
set $nord1  #3b4252
set $nord3  #4c566a
set $nord4  #d8dee9
set $nord8  #88c0d0
set $nord11 #bf616a
set $nord13 #ebcb8b
set $black  #000000
set $white  #ffffff
set $grey   #b0b5bd
# indicator = where the next window will open (split direction hint)
set $purple #e345ff

# class                 border   bground  text     indicator child_border
client.focused          $nord8   $nord1   $white   $purple   $nord8
client.unfocused        $nord1   $nord1   $grey    $nord3    $nord3
client.focused_inactive $nord1   $nord1   $grey    $black    $black
client.urgent           $nord11  $nord11  $white   #e1b700   #e1b700

# ── bar ───────────────────────────────────────────────────────
# Status line: i3status-rust (~/.config/i3status-rust/config.toml, nord-dark).
# Falls back to i3blocks where i3status-rs isn't installed (not packaged for
# Debian/Ubuntu).
bar {
        # Nerd Font first so i3status-rs "material-nf" icons render
        font pango: JetBrainsMono Nerd Font, Noto Sans 11
        status_command command -v i3status-rs >/dev/null && exec i3status-rs || exec i3blocks -c ~/.config/i3/i3blocks.conf
        position top
        # multi-monitor: tray on the primary output (xrandr --output <name> --primary)
        #tray_output primary
        tray_padding 0
        workspace_min_width 28
        # "1:[1]-Terminal" is shown as "[1]-Terminal"
        strip_workspace_numbers yes

        colors {
                background         $nord0
                statusline         $nord4
                separator          $nord3
#                                  border   bg       txt
                focused_workspace  $nord8   $nord8   $nord0
                active_workspace   $nord3   $nord3   #eceff4
                inactive_workspace $nord0   $nord0   $nord4
                urgent_workspace   $nord11  $nord11  #eceff4
                binding_mode       $nord13  $nord13  $nord0
        }
}
