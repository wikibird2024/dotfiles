# ===================================================================
# TMUX CONFIGURATION — APEX STABLE v2.1
# Optimized for Neovim, i3wm, Hyprland, SSH, and Embedded Development
# ===================================================================

# --- 1. CORE SETTINGS ----------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1             # Start window numbering at 1
setw -g pane-base-index 1        # Start pane numbering at 1
set -sg escape-time 0           # Zero escape delay for instant Vim mode switching
set -g focus-events on          # Pass focus events to nested applications (Neovim autoread)
set -g allow-passthrough on     # Let kitty graphics (kitten icat) through to the terminal
set -ga update-environment " KITTY_LISTEN_ON"  # kitty @ socket (kitty.conf listen_on)
set -g mouse on                 # Enable full mouse interactions
set -g history-limit 50000      # Generous scrollback buffer size for debugging/logging
setw -g monitor-activity on     # Flag windows/sessions with new output (red in the bar)
set -g visual-activity off      # ...but no "Activity in window" pop-up message

# --- 2. DISPLAY & COLORS -------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
set -as terminal-overrides ',*:Tc'

# --- STABILITY ---
set -g automatic-rename off
setw -g allow-rename off

# --- 3. KEYBINDINGS ------------------------------------------------
# Reload configuration with visible confirmation
bind r source-file ~/.tmux.conf \; display-message "⚡ Config reloaded!"

# Split windows while retaining the current working directory path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Session picker (tms switch): fuzzy-search open sessions by name
bind f display-popup -E -w 80% -h 70% "~/.cargo/bin/tms switch"
# Project picker (tms): pick a git repo, jump to its session (creates it if missing)
bind F display-popup -E -w 80% -h 70% "~/.cargo/bin/tms"
# Theme picker (theme pick): switch kitty/alacritty/tmux/Neovim colors together
bind T display-popup -E -w 60% -h 60% "~/.local/bin/theme pick"

# Pane navigation — handled by vim-tmux-navigator (C-hjkl works in both tmux and Neovim)
is_vim="ps -o state= -o comm= -t '#{pane_tty}' | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"
bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'
bind -n C-\\ if-shell "$is_vim" 'send-keys C-\\' 'select-pane -l'

# Keep Alt+hjkl as fallback if needed
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Step-based pane resizing (Prefix + repeatable Shift + HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Prefix-free resizing (Alt + Shift + hjkl), no repeat timeout
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# --- 4. VI MODE & CLIPBOARD ----------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# --- 5. STATUS BAR (themed powerline) --------------------------------
# Colors are roles (#{@thm_bg}, #{@thm_cyan}, ...). The defaults below are the
# original bar colors, so this file works on its own (no `theme` package, no
# profile picked). The active profile of the `theme` package overrides them;
# `theme <name>` re-sources the new one live.
set -g @thm_bg      "#1a1b26"  # bar background, text on pills
set -g @thm_fg      "#c0caf5"  # bar text
set -g @thm_fg_dim  "#a9b1d6"  # text on unfocused pane pills
set -g @thm_muted   "#565f89"  # inactive window tabs
set -g @thm_surface "#414868"  # separators, unfocused pane pills
set -g @thm_border  "#3b4261"  # idle pane borders
set -g @thm_session "#a9c79a"  # session pill
set -g @thm_yellow  "#e0af68"  # prefix pill, clock
set -g @thm_cyan    "#7dcfff"  # focused pane, zoom badge
set -g @thm_purple  "#bb9af7"  # window name, copy badge
set -g @thm_red     "#f7768e"  # activity flag, sync badge
set -g @thm_green   "#9ece6a"  # user@ip
set -g @thm_orange  "#ff9e64"  # ssh target / ssh pane
source-file -q ~/.local/state/theme/current/tmux.conf

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

set -g status-left-length 60
set -g status-right-length 160

# Left - current session as a solid pill in @thm_session (a soft green that
# sits calmly beside the window tab and is muted enough not to read as an
# nvim mode block; turns @thm_yellow while prefix key is active),
# closed with a powerline arrow glyph so it tapers into the bar bg instead of
# cutting off flat
# Mode badges: only shown while something unusual is on (prefix pressed, copy
# mode, panes synced, pane zoomed), so the keys doing odd things has a reason
set -g @mode-badges "#{?client_prefix,#[fg=#{@thm_yellow}#,bold]  PREFIX #[nobold],}#{?pane_in_mode,#[fg=#{@thm_purple}]  COPY ,}#{?synchronize-panes,#[fg=#{@thm_red}]  SYNC ,}#{?window_zoomed_flag,#[fg=#{@thm_cyan}]  ZOOM ,}"

set -g status-left "#[fg=#{@thm_bg},bg=#{?client_prefix,#{@thm_yellow},#{@thm_session}},bold]  #S #[fg=#{?client_prefix,#{@thm_yellow},#{@thm_session}},bg=#{@thm_bg},nobold]#{E:@mode-badges}"

# Inactive Window Tabs (Middle) - flat against the bar; red flag if window has
# unseen activity, magnifier glyph if zoomed (nerd-font icon, not emoji, so it
# stays single-width and does not jitter the bar width)
set -g window-status-format "#[fg=#{?window_activity_flag,#{@thm_red},#{@thm_muted}},bg=#{@thm_bg}] #I:#W#{?window_zoomed_flag,,} "

# Active Window Tab (Middle) - bright magenta pill (colour13, same as the git
# branch), opened and closed with powerline arrows so it reads as one
# continuous shape rather than a block pointed on one edge and flat-cut on
# the other
set -g window-status-current-format "#[fg=#{@thm_bg},bg=colour13,nobold]#[fg=#{@thm_bg},bg=colour13,bold]  #I:#{pane_current_command}#{?window_zoomed_flag,,} #[fg=colour13,bg=#{@thm_bg},nobold]"

# Telemetry Display (Right) - each block gets its own hue and a nerd-font icon
# so the bar reads at a glance: purple window name (the running command is
# in the active tab), orange ssh target (only while the pane runs ssh), green
# local user@ip, gold
# clock. Path/command stay regular weight (context); host/ip and clock are
# bold (identity/time - the parts worth noticing first). No path here: the
# pane header already shows repo/folder.
set -g status-right "#[fg=#{@thm_purple}] #W #[fg=#{@thm_surface}]│ #(~/.tmux/scripts/pane_ssh_target.sh '#{pane_tty}')#[fg=#{@thm_green},bold] #(~/.tmux/scripts/pane_identity.sh)#[nobold] #[fg=#{@thm_surface}]│ #[fg=#{@thm_yellow},bold] %H:%M#[nobold] "

# Terminal title - send "session · folder" to kitty (tab + window title, i3
# title bar too) so the current session is visible outside the tmux bar
set -g set-titles on
set -g set-titles-string "#S · #{b:pane_current_path}"

# Pane header - rounded folder pill (cyan on the focused pane, orange while it runs ssh, grey on the
# others) and git branch (purple) only inside a repo. The branch uses ANSI
# colour13, the slot the starship prompt uses for branch, so it matches any
# kitty theme. No session name here: it is already in status-left and tms
# names sessions after the repo
set -g pane-border-status top
# Pill colour: orange while the pane runs ssh (same orange as the ssh block in
# the status bar), cyan when focused on this machine, grey otherwise
set -g @pane-pill-colour "#{?pane_active,#{?#{==:#{pane_current_command},ssh},#{@thm_orange},#{@thm_cyan}},#{@thm_surface}}"
# While ssh runs the header shows the ssh target instead of the local folder
# and git branch (those belong to this machine, not the one you are on)
set -g pane-border-format "#[fg=#{E:@pane-pill-colour},bg=default]#[fg=#{?pane_active,#{@thm_bg},#{@thm_fg_dim}},bg=#{E:@pane-pill-colour},bold]#{?#{==:#{pane_current_command},ssh}, #(~/.tmux/scripts/pane_ssh_target.sh '#{pane_tty}' plain), #(~/.tmux/scripts/pane_location.sh '#{pane_current_path}')}#[fg=#{E:@pane-pill-colour},bg=default,nobold] #{?#{==:#{pane_current_command},ssh},,#(~/.tmux/scripts/pane_git_branch.sh '#{pane_current_path}') }"
# Border lines: dim for idle panes; orange (ssh) or cyan for the focused one,
# same as its pill
set -g pane-border-style "fg=#{@thm_border}"
set -g pane-active-border-style "fg=#{?#{==:#{pane_current_command},ssh},#{@thm_orange},#{@thm_cyan}}"

# --- 6. TPM & PLUGINS ----------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'

# --- 7. PLUGIN STRATEGY --------------------------------------------
# Automatically restore complete environment on host boot/startup
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @resurrect-capture-pane-contents 'on'
# Restore actual vim/nvim buffers (not just a blank relaunch) via :mksession
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Force manual save state checkpoint: Prefix + S
bind S run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message "💾 Session Saved!"

# Automatic Bootstrap: Install TPM and plugins immediately if missing
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
