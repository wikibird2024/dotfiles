# ===================================================================
# TMUX CONFIGURATION — APEX STABLE v2.1
# Optimized for Neovim, i3wm, Hyprland, SSH, and Embedded Development
# ===================================================================

# --- 1. CORE SETTINGS ----------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

set -g base-index 1             # Start window numbering at 1
setw -g pane-base-index 1        # Start pane numbering at 1
set -sg escape-time 0           # Zero escape delay for instant Vim mode switching
set -g focus-events on          # Pass focus events to nested applications (Neovim autoread)
set -g allow-passthrough on     # Let kitty graphics (kitten icat) through to the terminal
# Variables refreshed from the terminal on every attach. Fixed indexes (not -ga)
# so reloading the config does not add copies. KITTY_LISTEN_ON: kitty @ socket
# (kitty.conf listen_on). The Wayland ones: the tmux server outlives a logout,
# so after switching GNOME (X11) <-> niri (Wayland) copy tools must see the new
# session, not the old one.
set -g update-environment[20] KITTY_LISTEN_ON
set -g update-environment[21] WAYLAND_DISPLAY
set -g update-environment[22] NIRI_SOCKET
set -g update-environment[23] XDG_SESSION_TYPE
set -g mouse on                 # Enable full mouse interactions
set -g history-limit 50000      # Generous scrollback buffer size for debugging/logging
setw -g monitor-activity on     # Flag windows/sessions with new output (red in the bar)
set -g visual-activity off      # ...but no "Activity in window" pop-up message

# --- 2. DISPLAY & COLORS -------------------------------------------
set -g default-terminal "tmux-256color"
# What kitty and alacritty support: true color, undercurl (nvim diagnostics),
# clickable links, synced redraw. Fixed indexes so a reload does not add copies.
set -s terminal-features[20] "xterm-kitty:RGB:usstyle:hyperlinks:sync:strikethrough:overline"
set -s terminal-features[21] "alacritty:RGB:usstyle:hyperlinks:sync:strikethrough:overline"
set -s terminal-overrides[0] "*:Tc"  # true color for any other terminal that has it

# --- STABILITY ---
set -g automatic-rename off
setw -g allow-rename off

# --- 3. KEYBINDINGS ------------------------------------------------
# Reload configuration with visible confirmation
bind r source-file ~/.tmux.conf \; display-message "⚡ Config reloaded!"

# Split windows while retaining the current working directory path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Project/session picker (tms): pick a git repo or bookmark (bookmarks in
# ~/.config/tms/config.toml), jump to its session (creates it if missing)
bind f display-popup -E -w 80% -h 70% "~/.cargo/bin/tms"
# Theme picker (theme pick): switch kitty/alacritty/tmux/Neovim colors together
bind T display-popup -E -w 60% -h 60% -e THEME_PICK_HEIGHT=100% "~/.local/bin/theme pick"
# Lazygit for the current pane's repo (q closes the popup). Inside nvim,
# <leader>gg is the same in a float that stays open in the background.
bind g display-popup -E -w 95% -h 95% -d "#{pane_current_path}" lazygit
# Quick shell in the current pane's folder (exit closes it). Replaces the
# default clock-mode: the status bar already shows the time.
bind t display-popup -E -w 80% -h 80% -d "#{pane_current_path}"
# File manager (yazi) in the current pane's folder (q quits)
bind e display-popup -E -w 90% -h 90% -d "#{pane_current_path}" yazi

# Pane navigation: Ctrl+hjkl (and Ctrl+\\ = last pane) work across tmux panes and
# nvim splits; the vim-tmux-navigator plugin (section 6) sets these keys.

# Keep Alt+hjkl as fallback if needed
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R

# Step-based pane resizing (Prefix + repeatable Shift + HJKL)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Prefix-free resizing (Alt + Shift + hjkl), no repeat timeout
bind -n M-H resize-pane -L 5
bind -n M-J resize-pane -D 5
bind -n M-K resize-pane -U 5
bind -n M-L resize-pane -R 5

# --- 4. VI MODE & CLIPBOARD ----------------------------------------
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
# Copy (y, Enter, mouse drag) comes from tmux-yank. Where it goes:
# - set-clipboard on: tmux also passes copies (its own and nvim's/Claude's OSC 52,
#   even over ssh) to kitty, which puts them in the system clipboard.
# - the copy tool is picked at copy time, not at tmux start: wl-copy under niri
#   (Wayland), xclip under GNOME on Xorg / i3. tmux-yank alone always chose
#   wl-copy once installed, which fails under X11.
set -s set-clipboard on
set -g @override_copy_command '~/.tmux/scripts/clipboard_copy.sh'

# --- 5. STATUS BAR (themed powerline) --------------------------------
# Colors are roles (#{@thm_bg}, #{@thm_cyan}, ...). The defaults below are the
# original bar colors, so this file works on its own (no `theme` package, no
# profile picked). The active profile of the `theme` package overrides them;
# `theme <name>` re-sources the new one live.
set -g @thm_bg      "#1a1b26"  # bar background, text on pills
set -g @thm_fg      "#c0caf5"  # bar text
set -g @thm_fg_dim  "#a9b1d6"  # text on unfocused pane pills
set -g @thm_muted   "#565f89"  # inactive window tabs
set -g @thm_surface "#414868"  # separators, unfocused pane pills
set -g @thm_tray    "#292e42"  # Agents list tray (navy from the bar's family; the orange label is the only warm accent)
set -g @thm_border  "#45223a"  # idle pane borders (close to the terminal bg: quiet)
set -g @thm_pane_dim "#1a0614" # background of unfocused panes (terminal bg, darker)
set -g @thm_session "#a9c79a"  # session pill
set -g @thm_yellow  "#e0af68"  # prefix pill, clock
set -g @thm_cyan    "#7dcfff"  # zoom badge
set -g @thm_neon    "#39ff14"  # focused pane pill + border (neon: easy to spot)
set -g @thm_purple  "#bb9af7"  # window name, copy badge
set -g @thm_red     "#f7768e"  # activity flag, sync badge
set -g @thm_green   "#9ece6a"  # user@ip
set -g @thm_done    "#73daca"  # AI agent finished (a teal-green, not the user@ip green)
set -g @thm_orange  "#ff9e64"  # ssh target / ssh pane
# Not a theme role: the Claude logo orange, the same in every profile
set -g @claude_orange "#d97757"  # Agents pill
source-file -q ~/.local/state/theme/current/tmux.conf

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#{@thm_bg},fg=#{@thm_fg}"

set -g status-left-length 60
set -g status-right-length 200

# Left - current session as a solid pill in @thm_session (a soft green that
# sits calmly beside the window tab and is muted enough not to read as an
# nvim mode block; turns @thm_yellow while prefix key is active),
# closed with a powerline arrow glyph so it tapers into the bar bg instead of
# cutting off flat
# Mode badges: only shown while something unusual is on (prefix pressed, copy
# mode, panes synced, pane zoomed), so the keys doing odd things has a reason
set -g @mode-badges "#{?client_prefix,#[fg=#{@thm_yellow}#,bold]  PREFIX #[nobold],}#{?pane_in_mode,#[fg=#{@thm_purple}]  COPY ,}#{?synchronize-panes,#[fg=#{@thm_red}]  SYNC ,}#{?window_zoomed_flag,#[fg=#{@thm_cyan}]  ZOOM ,}"

set -g status-left "#[fg=#{@thm_bg},bg=#{?client_prefix,#{@thm_yellow},#{@thm_session}},bold]  #S #[fg=#{?client_prefix,#{@thm_yellow},#{@thm_session}},bg=#{@thm_bg},nobold]#{E:@mode-badges}"

# Inactive Window Tabs (Middle) - flat against the bar; red flag if window has
# unseen activity, magnifier glyph if zoomed (nerd-font icon, not emoji, so it
# stays single-width and does not jitter the bar width)
set -g window-status-format "#[fg=#{?window_activity_flag,#{@thm_red},#{@thm_muted}},bg=#{@thm_bg}] #I:#W#{?window_zoomed_flag,,}#{?#{@agent_icon}, #[fg=#{@agent_fg}#,bold]#{@agent_icon}#[default],} "

# Active Window Tab (Middle) - bright magenta pill (colour13, same as the git
# branch), opened and closed with powerline arrows so it reads as one
# continuous shape rather than a block pointed on one edge and flat-cut on
# the other
set -g window-status-current-format "#[fg=#{@thm_bg},bg=colour13,nobold]#[fg=#{@thm_bg},bg=colour13,bold]  #I:#{pane_current_command}#{?window_zoomed_flag,,} #[fg=colour13,bg=#{@thm_bg},nobold]#{?#{@agent_icon}, #[fg=#{@agent_fg}#,bold]#{@agent_icon}#[default],}"

# Telemetry Display (Right) - each block gets its own hue and a nerd-font icon
# so the bar reads at a glance: orange ssh target (only while the pane runs
# ssh), green local user@ip, gold clock. Host/ip and clock are bold
# (identity/time - the parts worth noticing first). No window name: renaming
# is off (STABILITY above), so it always read "bash"; the running command is
# in the active tab. No path here: the pane header already shows repo/folder.
# Agents (@agent-block, drawn just after the session pill by status-format
# below; shown only while any agent exists): an "Agents" label: a solid Claude-orange
# pill, notched ">" on the left (fits the session pill arrow), only while an agent needs you or asks (else
# bright orange (@thm_orange) "Agents:" text on the tray, so the bar stays quiet); its powerline arrow
# points at the list (so "Agents" reads as the heading, not as one more
# session - same pattern as the session pill on the left), then the agents
# grouped by session on a @thm_tray tray (a navy a step above the bar) closed by a powerline arrow, so
# the label and its list read as one shape
# (sessions without a Claude agent are skipped):
# the session name (16 chars): the session you are in uses the session
# pill's color (@thm_session, bold); the others are colored by their most urgent agent - yellow
# needs you, orange asks, teal-green (@thm_done) finished unseen, cyan working, plain text
# (@thm_fg: bright enough to read on the tray) all idle
# - then one icon per window with agents (several Claudes in one window
# share it): 󰂚 needs you, 󰋗 asks, 󰄬 finished unseen, 󰔟 working, · idle.
# Colors test the joined pane states with #{m:*blocked*,...}, so no script
# is needed and it updates instantly. Names and icons are user ranges
# carrying the session id ($N) or window id (@N): a click jumps there (see
# MouseDown1Status below). #{?0,#{@agent_summary},} renders nothing but keeps
# the literal token in the line, so the plugin's loader does not re-prepend
# its per-agent glyph strip.
set -g @agent-block "#{?#{S:#{W:#{P:#{?#{@agent_kind},1,}}}},#{?#{m/r:blocked|ask,#{S:#{W:#{P:#{?#{@agent_kind},#{@agent_pane_state} ,}}}}},#[fg=#{@thm_bg}#,bg=#{@claude_orange}]#[fg=#{@thm_bg}#,bg=#{@claude_orange}#,bold] Agents #[nobold]#[fg=#{@claude_orange}#,bg=#{@thm_tray}],#[fg=#{@thm_bg}#,bg=#{@thm_tray}]#[fg=#{@thm_orange}#,bg=#{@thm_tray}#,bold] Agents:#[nobold]} ,}#{S:#{?#{W:#{P:#{?#{@agent_kind},1,}}},#[range=user|#{session_id}]#{?#{==:#{session_name},#{client_session}},#[fg=#{@thm_session}#,bold],#{?#{m:*blocked*,#{W:#{P:#{?#{@agent_kind},#{@agent_pane_state} ,}}}},#[fg=#{@thm_yellow}#,bold],#{?#{m:*ask*,#{W:#{P:#{?#{@agent_kind},#{@agent_pane_state} ,}}}},#[fg=#{@thm_orange}#,bold],#{?#{m:*done*,#{W:#{P:#{?#{@agent_kind},#{@agent_pane_state} ,}}}},#[fg=#{@thm_done}],#{?#{m:*working*,#{W:#{P:#{?#{@agent_kind},#{@agent_pane_state} ,}}}},#[fg=#{@thm_cyan}],#[fg=#{@thm_fg}]}}}}}#{=/16/…:session_name}#[norange]#[nobold] #{W:#{?#{P:#{?#{@agent_kind},#{?pane_dead,,1},}},#[range=user|#{window_id}]#{?#{m:*blocked*,#{P:#{?#{@agent_kind},#{?pane_dead,,#{@agent_pane_state} },}}},#[fg=#{@thm_yellow}#,bold]󰂚,#{?#{m:*ask*,#{P:#{?#{@agent_kind},#{?pane_dead,,#{@agent_pane_state} },}}},#[fg=#{@thm_orange}#,bold]󰋗,#{?#{m:*done*,#{P:#{?#{@agent_kind},#{?pane_dead,,#{@agent_pane_state} },}}},#[fg=#{@thm_done}#,bold]󰄬,#{?#{m:*working*,#{P:#{?#{@agent_kind},#{?pane_dead,,#{@agent_pane_state} },}}},#[fg=#{@thm_cyan}#,bold]󰔟,#[fg=#{@thm_fg}]·}}}}#[norange]#[nobold],}}  ,}}#{?#{S:#{W:#{P:#{?#{@agent_kind},1,}}}},#[fg=#{@thm_tray}#,bg=#{@thm_bg}],}#[norange default]"
set -g status-right "#{?0,#{@agent_summary},}#(~/.tmux/scripts/pane_ssh_target.sh '#{pane_tty}')#[fg=#{@thm_green},bold] #(~/.tmux/scripts/pane_identity.sh)#[nobold] #[fg=#{@thm_surface}]│ #[fg=#{@thm_yellow},bold] %H:%M#[nobold] "
# Status line = tmux 3.4's default status-format[0] with one change: the
# agent block (@agent-block) is drawn right after the session pill
# (status-left), its closing arrow leading straight into the window tabs
set -g 'status-format[0]' '#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#{E:@agent-block}#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?window_end_flag,,#{window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?window_end_flag,,#{window-status-separator}}}#[nolist]#[align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]'

# Terminal title - send "session · folder" to kitty (tab + window title, i3
# title bar too) so the current session is visible outside the tmux bar
set -g set-titles on
set -g set-titles-string "#S · #{b:pane_current_path}"

# Pane header - slim text, no pill: folder and git branch (only inside a repo).
# Focused pane: neon and bold (orange while it runs ssh), branch in purple
# (ANSI colour13, the slot the starship prompt uses for branch, so it matches
# any kitty theme). Other panes: all dim grey, so only one label stands out.
# No session name here: it is already in status-left and tms names sessions
# after the repo
set -g pane-border-status top
# Label colour: orange while the pane runs ssh (same orange as the ssh block in
# the status bar), neon green when focused on this machine (@thm_neon), dim grey otherwise
set -g @pane-label-colour "#{?pane_active,#{?#{==:#{pane_current_command},ssh},#{@thm_orange},#{@thm_neon}},#{@thm_muted}}"
# 1 while a shell is in front of the pane (its prompt is on screen)
set -g @pane-at-shell '#{m/r:^(bash|zsh|fish|sh|dash)$,#{pane_current_command}}'
# What the header shows:
#   ssh runs       -> the ssh target (folder and branch belong to this machine,
#                     not the one you are on)
#   shell prompt   -> nothing, the border stays one plain line: the starship
#                     prompt already shows folder and branch
#   other program  -> folder and git branch (nvim, claude... hide the prompt)
set -g pane-border-format "#{?#{E:@pane-at-shell},,#[fg=#{E:@pane-label-colour}]#[bg=default]#[#{?pane_active,bold,nobold}] #{?#{==:#{pane_current_command},ssh}, #(~/.tmux/scripts/pane_ssh_target.sh '#{pane_tty}' plain), #(~/.tmux/scripts/pane_location.sh '#{pane_current_path}')}#{?#{==:#{pane_current_command},ssh},, #[fg=#{?pane_active,colour13,#{@thm_muted}}]#(~/.tmux/scripts/pane_git_branch.sh '#{pane_current_path}')} }"
# Border lines: dim for idle panes; orange (ssh) or neon for the focused one,
# same as its label
set -g pane-border-style "fg=#{@thm_border}"
set -g pane-active-border-style "fg=#{?#{==:#{pane_current_command},ssh},#{@thm_orange},#{@thm_neon}}"
# Unfocused panes get a darker background, so the focused one stands out
# without relying on lines. Programs that paint their own background (nvim
# with a colorscheme) keep it; Claude and the shell use the terminal's.
set -g window-style "bg=#{@thm_pane_dim}"
set -g window-active-style "bg=default"

# --- 6. TPM & PLUGINS ----------------------------------------------
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'christoomey/vim-tmux-navigator'
# Our fork's fix branch until jward7/tmux-agent-signal merges it ("done" also
# shows for sessions open in a background terminal tab); then switch back to
# 'jward7/tmux-agent-signal'.
set -g @plugin 'wikibird2024/tmux-agent-signal#fix/visible-needs-focused-client'

# --- 7. PLUGIN STRATEGY --------------------------------------------
# Automatically restore complete environment on host boot/startup
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
# Off: resurrect saves each pane's screen with its color codes and prints it
# back into a fresh shell on restore, so panes that ran nvim or Claude came
# back full of a dead copy of that screen. Sessions, windows, layouts and
# folders are still restored.
set -g @resurrect-capture-pane-contents 'off'
# Programs to restart in their pane (added to resurrect's default list):
# - nvim: plain `nvim` with the same arguments. The saved command is the
#   AppImage's temporary /tmp/.mount_nvim* path, which is gone after a reboot.
# - claude: resume the most recent conversation in that pane's folder.
set -g @resurrect-processes '"~nvim->nvim *" "~claude->claude --continue"'
# Never leave a pane title empty (Claude clears it on exit). resurrect saves
# with bash `read` on tabs, which drops an empty field, so every later field
# shifted: the pane came back in the wrong folder without its program. Titles
# are not shown anywhere in this setup; the folder name fills the gap.
set-hook -g pane-title-changed 'if -F "#{==:#{pane_title},}" { select-pane -T "#{b:pane_current_path}" }'
# Restore actual vim/nvim buffers (not just a blank relaunch) via :mksession
set -g @resurrect-strategy-vim 'session'
set -g @resurrect-strategy-nvim 'session'

# Claude Code agent state in the bar (tmux-agent-signal v0.3.0 plus our
# focus fix, from the fork in the plugin list; its hooks live in
# ~/.claude/settings.json, see
# claude/README.md). The window formats above already carry its badge
# (#{@agent_icon}) and status-right the @agent_summary token, so the plugin
# adds nothing to them on load. Keys: prefix+N = next agent (ours, below),
# prefix+A = plugin's switcher popup (fzf), prefix+W/P = hold.
# Badges only - the tabs keep their own colors and pill shape
set -g @agent_signal_tab_colour off
# No sounds; a desktop notification (notify-send -> swaync) when a window
# that is not on screen becomes blocked / ask / done
set -g @agent_signal_sound off
set -g @agent_signal_notify on
# Badge icons and colors come from the @thm_* roles; `theme` re-runs this
# script after a switch, because the plugin reads the options as plain text
run-shell '~/.tmux/scripts/agent_signal_colors.sh'
# Jump key: an agent that needs you first, else cycle the working agents
# (scripts/agent_jump.sh, kitty-tab aware). The plugin's own N binding is
# turned off so ours takes the key without a warning on reload.
set -g @agent_signal_key_next ""
bind N run-shell -b '~/.tmux/scripts/agent_jump.sh'
# Click in the agent block of status-right: an icon's range carries its
# window id (@N) -> that window's most urgent agent; a session name's range
# carries the session id ($N) -> that session's most urgent agent. Both focus the session's kitty tab when
# it is open there. The $N is single-quoted so sh does not expand it. Any
# other status click keeps tmux's default (select window).
bind -n MouseDown1Status if -F '#{m:@*,#{mouse_status_range}}' \
    { run-shell -b "~/.tmux/scripts/agent_jump.sh window #{mouse_status_range} #{client_name}" } \
    { if -F '#{m:$*,#{mouse_status_range}}' \
        { run-shell -b "~/.tmux/scripts/agent_jump.sh session '#{mouse_status_range}' #{client_name}" } \
        { select-window -t = } }

# Force manual save state checkpoint: Prefix + S
bind S run-shell '~/.tmux/plugins/tmux-resurrect/scripts/save.sh' \; display-message "💾 Session Saved!"

# Automatic Bootstrap: Install TPM and plugins immediately if missing
if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

run '~/.tmux/plugins/tpm/tpm'
