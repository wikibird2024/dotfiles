# =======================================================================
# Alacritty Config - Optimized for i3wm, Arch Linux, and JetBrains Mono
# =======================================================================

[general]
live_config_reload = true
# Colors: colors-fallback.toml, then the active profile of the `theme` package
# (generated from its palette.conf) on top. Later imports win and missing ones
# are skipped, so this works without the package. Switch with: theme <name>
import = [
    "~/.config/alacritty/colors-fallback.toml",
    "~/.local/state/theme/alacritty.toml",
]

[window]
decorations = "full"
startup_mode = "Windowed"  # Capitalized to match Alacritty's strict Enum parsing
opacity = 0.92  # niri blurs the wallpaper behind it (niri config.kdl)

[window.padding]
x = 10
y = 10

[font]
size = 10.5

[font.normal]
family = "JetBrains Mono Nerd Font"
style = "Regular"

[font.bold]
family = "JetBrains Mono Nerd Font"
style = "Bold"

[font.italic]
family = "JetBrains Mono Nerd Font"
style = "Italic"

[font.bold_italic]
family = "JetBrains Mono Nerd Font"
style = "Bold Italic"

[font.offset]
x = 0
y = 4

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 10000
multiplier = 3

[selection]
save_to_clipboard = true

[[mouse.bindings]]
mouse = "Right"
action = "PasteSelection"

# --- Keyboard Shortcuts (Zoom Control) ---
[[keyboard.bindings]]
key = "Equals"
mods = "Control"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Control"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Control"
action = "ResetFontSize"

[env]
TERM = "xterm-256color"

[[keyboard.bindings]]
key = "Return"
mods = "Shift"
chars = "\u001B\r"
