# Fallback colors: the `ubuntu` profile (aubergine), the same home look every
# tool falls back to (kitty theme.conf, .tmux.conf defaults, nvim onedark).
# Used when the `theme` package is missing or no profile is picked; the active
# profile, imported after this file in alacritty.toml, overrides it.
# The original custom alacritty Gruvbox is the `gruvbox-classic` profile.

[colors.primary]
background = "#300a24"
foreground = "#eeeeec"

[colors.cursor]
text = "#300a24"
cursor = "#bbbbbb"

[colors.selection]
text = "#ffffff"
background = "#204a87"

[colors.normal]
black   = "#2e3436"
red     = "#cc0000"
green   = "#4e9a06"
yellow  = "#c4a000"
blue    = "#3465a4"
magenta = "#75507b"
cyan    = "#06989a"
white   = "#d3d7cf"

[colors.bright]
black   = "#555753"
red     = "#ef2929"
green   = "#2ed011"
yellow  = "#fce94f"
blue    = "#87ceeb"
magenta = "#ad7fa8"
cyan    = "#34e2e2"
white   = "#eeeeec"
