# Launcher and menus for niri when Noctalia is not installed (Ubuntu 24.04).
# Colors come from the active `theme` profile: scripts/shell adds a [colors]
# section in ~/.cache/niri-shell/fuzzel.ini and runs fuzzel with that file.
[main]
font=JetBrainsMono Nerd Font:size=12
terminal=kitty -e
prompt="  "
width=40
lines=10
horizontal-pad=20
vertical-pad=14
inner-pad=8
icons-enabled=yes

[border]
width=2
radius=12
