# niri cannot work without the session bus, and the login ends when the bus dies.
# Linger keeps this user's services running after that, so niri stayed active and
# every new login failed with "A niri session is already running" until a reboot
# (2026-11-05, three times). Now niri stops together with the bus.
[Unit]
BindsTo=dbus.service
After=dbus.service
