# Applies to every tmux pane: tmux names each pane's scope tmux-spawn-<id>.
# One pane must not be able to starve the others or the desktop.
#   MemoryHigh: the pane is slowed down from here (file cache is dropped first)
#   MemoryMax: the kernel kills the biggest process in this pane, nothing outside it
#   MemorySwapMax: without it a pane keeps growing in swap and everything crawls
# OOMPolicy=continue: only that process dies; the pane and its shell stay open.
# See who was killed: journalctl -k -g oom-kill
[Scope]
MemoryHigh=6G
MemoryMax=8G
MemorySwapMax=2G
OOMPolicy=continue
