# All apps together (Firefox, tmux panes, ...) leave memory free for the desktop,
# which runs in session.slice. PC has 15 GB. Limit of one pane: tmux-spawn-.scope.d
#   MemoryHigh: apps are slowed down from here (file cache is dropped first)
#   MemoryMax: the kernel kills one process here, the biggest in app.slice
# See who was killed: journalctl -k -g oom-kill
[Slice]
MemoryHigh=11G
MemoryMax=13G
