# Abyss (boreal) — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
set -g @thm_bg      "#000c18"  # bar background, text on pills
set -g @thm_fg      "#80a2b7"  # bar text
set -g @thm_fg_dim  "#406385"  # text on unfocused pane pills
set -g @thm_muted   "#384887"  # inactive window tabs
set -g @thm_surface "#08286b"  # separators, unfocused pane pills
set -g @thm_tray    "#2a1f10"  # Agents list tray (the Agents pill orange, dimmed: text stays readable)
set -g @thm_border  "#000c38"  # idle pane borders
set -g @thm_pane_dim "#00060c" # background of unfocused panes (terminal bg, darker)
set -g @thm_session "#6688cc"  # session pill
set -g @thm_yellow  "#ddbb88"  # prefix pill, clock
set -g @thm_cyan    "#57b6c2"  # zoom badge
set -g @thm_neon    "#39ff14"  # focused pane pill + border (neon: easy to spot)
set -g @thm_purple  "#9966b8"  # window name, copy badge
set -g @thm_red     "#cb4444"  # activity flag, sync badge
set -g @thm_green   "#44cb46"  # user@ip
set -g @thm_done    "#22aa44"  # AI agent finished (a darker green, not the user@ip green)
set -g @thm_orange  "#ff9900"  # ssh target / ssh pane
