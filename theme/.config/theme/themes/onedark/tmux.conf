# One Dark (darker) — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
set -g @thm_bg      "#1f2329"  # bar background, text on pills
set -g @thm_fg      "#a0a8b7"  # bar text
set -g @thm_fg_dim  "#a0a8b7"  # text on unfocused pane pills
set -g @thm_muted   "#7a818e"  # inactive window tabs
set -g @thm_surface "#535965"  # separators, unfocused pane pills
set -g @thm_border  "#30363f"  # idle pane borders
set -g @thm_session "#8ebd6b"  # session pill
set -g @thm_yellow  "#e2b86b"  # prefix pill, clock
set -g @thm_cyan    "#48b0bd"  # zoom badge
set -g @thm_neon    "#39ff14"  # focused pane pill + border (neon: easy to spot)
set -g @thm_purple  "#bf68d9"  # window name, copy badge
set -g @thm_red     "#e55561"  # activity flag, sync badge
set -g @thm_green   "#8ebd6b"  # user@ip
set -g @thm_orange  "#cc9057"  # ssh target / ssh pane
