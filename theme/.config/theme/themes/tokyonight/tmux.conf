# Tokyo Night (night) — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
set -g @thm_bg      "#1a1b26"  # bar background, text on pills
set -g @thm_fg      "#c0caf5"  # bar text
set -g @thm_fg_dim  "#a9b1d6"  # text on unfocused pane pills
set -g @thm_muted   "#565f89"  # inactive window tabs
set -g @thm_surface "#414868"  # separators, unfocused pane pills
set -g @thm_border  "#3b4261"  # idle pane borders
set -g @thm_session "#a9c79a"  # session pill
set -g @thm_yellow  "#e0af68"  # prefix pill, clock
set -g @thm_cyan    "#7dcfff"  # zoom badge
set -g @thm_neon    "#39ff14"  # focused pane pill + border (neon: easy to spot)
set -g @thm_purple  "#bb9af7"  # window name, copy badge
set -g @thm_red     "#f7768e"  # activity flag, sync badge
set -g @thm_green   "#9ece6a"  # user@ip
set -g @thm_orange  "#ff9e64"  # ssh target / ssh pane
