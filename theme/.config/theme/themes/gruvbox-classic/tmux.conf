# Gruvbox classic (original alacritty colors) — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
set -g @thm_bg      "#282828"  # bar background, text on pills
set -g @thm_fg      "#fbf1c7"  # bar text
set -g @thm_fg_dim  "#d5c4a1"  # text on unfocused pane pills
set -g @thm_muted   "#928374"  # inactive window tabs
set -g @thm_surface "#504945"  # separators, unfocused pane pills
set -g @thm_border  "#3c3836"  # idle pane borders
set -g @thm_session "#8ec07c"  # session pill
set -g @thm_yellow  "#fabd2f"  # prefix pill, clock
set -g @thm_cyan    "#83a598"  # focused pane, zoom badge
set -g @thm_purple  "#d3869b"  # window name, copy badge
set -g @thm_red     "#fb4934"  # activity flag, sync badge
set -g @thm_green   "#b8bb26"  # user@ip
set -g @thm_orange  "#fe8019"  # ssh target / ssh pane
