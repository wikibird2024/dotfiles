# Rosé Pine (main) — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
# Rosé Pine has no true green: foam (aqua) stands in for the green roles.
set -g @thm_bg      "#191724"  # bar background, text on pills
set -g @thm_fg      "#e0def4"  # bar text
set -g @thm_fg_dim  "#908caa"  # text on unfocused pane pills
set -g @thm_muted   "#6e6a86"  # inactive window tabs
set -g @thm_surface "#403d52"  # separators, unfocused pane pills
set -g @thm_border  "#26233a"  # idle pane borders
set -g @thm_session "#9ccfd8"  # session pill
set -g @thm_yellow  "#f6c177"  # prefix pill, clock
set -g @thm_cyan    "#9ccfd8"  # zoom badge
set -g @thm_neon    "#39ff14"  # focused pane pill + border (neon: easy to spot)
set -g @thm_purple  "#c4a7e7"  # window name, copy badge
set -g @thm_red     "#eb6f92"  # activity flag, sync badge
set -g @thm_green   "#9ccfd8"  # user@ip
set -g @thm_orange  "#ebbcba"  # ssh target / ssh pane
