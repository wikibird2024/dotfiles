# Moonfly — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
# Colors from vim-moonfly-colors (lua/moonfly/init.lua and its kitty file).
set -g @thm_bg      "#080808"  # bar background, text on pills
set -g @thm_fg      "#c6c6c6"  # bar text
set -g @thm_fg_dim  "#9e9e9e"  # text on unfocused pane pills
set -g @thm_muted   "#626262"  # inactive window tabs
set -g @thm_surface "#323437"  # separators, unfocused pane pills
set -g @thm_tray    "#2a1d14"  # Agents list tray (the Agents pill orange, dimmed: text stays readable)
set -g @thm_border  "#262626"  # idle pane borders
set -g @thm_pane_dim "#000000" # background of unfocused panes (darker than the terminal, so Neovim #262626 stands out)
set -g @thm_session "#80a0ff"  # session pill
set -g @thm_yellow  "#e3c78a"  # prefix pill, clock
set -g @thm_cyan    "#79dac8"  # zoom badge
set -g @thm_neon    "#39ff14"  # focused pane pill + border (neon: easy to spot)
set -g @thm_purple  "#ae81ff"  # window name, copy badge
set -g @thm_red     "#ff5d5d"  # activity flag, sync badge
set -g @thm_green   "#8cc85f"  # user@ip
set -g @thm_done    "#36c692"  # AI agent finished (emerald, not the user@ip green)
set -g @thm_orange  "#de935f"  # ssh target / ssh pane
