# Carbonfox — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
# Carbonfox has no yellow or orange: teal and pink stand in for them.
set -g @thm_bg      "#161616"  # bar background, text on pills
set -g @thm_fg      "#dfdfe0"  # bar text
set -g @thm_fg_dim  "#8a8a8b"  # text on unfocused pane pills
set -g @thm_muted   "#6e6f70"  # inactive window tabs
set -g @thm_surface "#2a2a2a"  # separators, unfocused pane pills
set -g @thm_tray    "#2a1d18"  # Agents list tray (the Agents pill orange, dimmed: text stays readable)
set -g @thm_border  "#282828"  # idle pane borders
set -g @thm_pane_dim "#0c0c0c" # background of unfocused panes (terminal bg, darker)
set -g @thm_session "#78a9ff"  # session pill
set -g @thm_yellow  "#08bdba"  # prefix pill, clock
set -g @thm_cyan    "#33b1ff"  # zoom badge
set -g @thm_neon    "#39ff14"  # focused pane pill + border (neon: easy to spot)
set -g @thm_purple  "#be95ff"  # window name, copy badge
set -g @thm_red     "#ee5396"  # activity flag, sync badge
set -g @thm_green   "#46c880"  # user@ip
set -g @thm_done    "#25be6a"  # AI agent finished (a darker green, not the user@ip green)
set -g @thm_orange  "#ff7eb6"  # ssh target / ssh pane
