# Kanagawa (dragon) — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
# Colors from kanagawa.nvim's dragon palette (lua/kanagawa/colors.lua).
set -g @thm_bg      "#181616"  # bar background, text on pills
set -g @thm_fg      "#c5c9c5"  # bar text
set -g @thm_fg_dim  "#9e9b93"  # text on unfocused pane pills
set -g @thm_muted   "#737c73"  # inactive window tabs
set -g @thm_surface "#393836"  # separators, unfocused pane pills
set -g @thm_tray    "#2a1f1a"  # Agents list tray (the Agents pill orange, dimmed: text stays readable)
set -g @thm_border  "#282727"  # idle pane borders
set -g @thm_pane_dim "#0d0c0c" # background of unfocused panes (terminal bg, darker)
set -g @thm_session "#8ba4b0"  # session pill
set -g @thm_yellow  "#c4b28a"  # prefix pill, clock
set -g @thm_cyan    "#8ea4a2"  # zoom badge
set -g @thm_neon    "#39ff14"  # focused pane pill + border (neon: easy to spot)
set -g @thm_purple  "#a292a3"  # window name, copy badge
set -g @thm_red     "#c4746e"  # activity flag, sync badge
set -g @thm_green   "#87a987"  # user@ip
set -g @thm_done    "#8a9a7b"  # AI agent finished (a darker green, not the user@ip green)
set -g @thm_orange  "#b6927b"  # ssh target / ssh pane
