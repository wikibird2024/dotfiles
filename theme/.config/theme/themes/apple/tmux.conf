# Apple dark — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
set -g @thm_bg      "#292a30"  # bar background, text on pills
set -g @thm_fg      "#dfdfe0"  # bar text
set -g @thm_fg_dim  "#aeaeb2"  # text on unfocused pane pills
set -g @thm_muted   "#7f8c98"  # inactive window tabs
set -g @thm_surface "#414453"  # separators, unfocused pane pills
set -g @thm_border  "#36373e"  # idle pane borders
set -g @thm_session "#32d74b"  # session pill
set -g @thm_yellow  "#ffd60a"  # prefix pill, clock
set -g @thm_cyan    "#64d2ff"  # zoom badge
set -g @thm_neon    "#39ff14"  # focused pane pill + border (neon: easy to spot)
set -g @thm_purple  "#bf5af2"  # window name, copy badge
set -g @thm_red     "#ff453a"  # activity flag, sync badge
set -g @thm_green   "#32d74b"  # user@ip
set -g @thm_orange  "#ff9f0a"  # ssh target / ssh pane
