# Apple dark — terminal palette (kitty syntax; the alacritty config is generated from it)
# Background, text and selection from Xcode's "Default (Dark)" (the xcodedark Neovim theme,
# so terminal and editor blend); the 8 hues are the macOS dark-mode system colors
# (systemRed, systemGreen, systemYellow, systemBlue, systemPurple, systemCyan), with the
# bright slots taking Apple's lighter "accessible" variants.

background           #292a30
foreground           #dfdfe0
cursor               #0a84ff
cursor_text_color    #ffffff
selection_background #414453
selection_foreground #ffffff

color0  #414453
color1  #ff453a
color2  #32d74b
color3  #ffd60a
color4  #0a84ff
color5  #bf5af2
color6  #64d2ff
color7  #dfdfe0
color8  #7f8c98
color9  #ff6961
color10 #30db5b
color11 #ffd426
color12 #409cff
color13 #da8fff
color14 #70d7ff
color15 #ffffff
