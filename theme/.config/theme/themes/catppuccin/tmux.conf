# Catppuccin Mocha — tmux palette. .tmux.conf reads these as #{@thm_*}; `theme` sources
# this file into the running server, so a switch needs no tmux restart.
set -g @thm_bg      "#1e1e2e"  # bar background, text on pills
set -g @thm_fg      "#cdd6f4"  # bar text
set -g @thm_fg_dim  "#bac2de"  # text on unfocused pane pills
set -g @thm_muted   "#6c7086"  # inactive window tabs
set -g @thm_surface "#45475a"  # separators, unfocused pane pills
set -g @thm_border  "#313244"  # idle pane borders
set -g @thm_session "#a6e3a1"  # session pill
set -g @thm_yellow  "#f9e2af"  # prefix pill, clock
set -g @thm_cyan    "#89dceb"  # focused pane, zoom badge
set -g @thm_purple  "#cba6f7"  # window name, copy badge
set -g @thm_red     "#f38ba8"  # activity flag, sync badge
set -g @thm_green   "#a6e3a1"  # user@ip
set -g @thm_orange  "#fab387"  # ssh target / ssh pane
